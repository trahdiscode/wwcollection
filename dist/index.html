ly entered the history books, concluding its primary theatrical run with a staggering ₹1,050 Crore worldwide gross.`,`The film collected $18.5 Million in North America alone, setting a modern benchmark for Indian cinema abroad in 2024. The Hindi dubbed version alone contributed over ₹330 Crore gross, demonstrating pan-Indian audience integration.`]},{id:`news-3`,title:`Inside Out 2 Becomes Highest-Grossing Animated Film in World History, Overtaking Frozen II`,summary:`Disney and Pixar’s emotional blockbuster cruises past $1.698 Billion worldwide, capturing the #8 spot on the all-time global box office leaderboard.`,category:`Milestone`,industry:`Hollywood`,date:`2024-08-14`,readTime:`3 min read`,source:`The Hollywood Reporter / Box Office Trade`,relatedMovieId:`inside-out-2`,highlightStat:`$1.698 Billion Worldwide Gross`,featured:!0,content:[`Inside Out 2 has achieved an unprecedented cinematic milestone, surpassing Frozen II ($1.45B) to become the undisputed #1 highest-grossing animated movie in the history of cinema.`,`Fueled by remarkable word of mouth across Latin America, Europe, and North America, the film held theater screens for over 14 consecutive weeks with sub-35% weekly drops.`]},{id:`news-4`,title:`Stree 2 Delivers Unprecedented 546% ROI: Becomes Most Profitable Bollywood Film of the Decade`,summary:`Produced on a modest ₹60 Crore budget, Dinesh Vijan’s horror-comedy universe vehicle eclipses ₹874 Crore gross to make Indian trade history.`,category:`Trade Analysis`,industry:`Bollywood`,date:`2024-09-22`,readTime:`5 min read`,source:`Cinema Trade Analyst Network`,relatedMovieId:`stree-2`,highlightStat:`546% Net Theatrical ROI`,featured:!1,content:[`While mega-budget tentpoles often dominate trade headlines, Stree 2 proved that exceptional storytelling and horror-comedy franchise goodwill yield the greatest commercial returns in modern cinema.`,`By eclipsing Jawan’s domestic Hindi net collection record with ₹627 Cr nett in India, Stree 2 demonstrated unprecedented longevity across single screens and multiplex chains alike.`]},{id:`news-5`,title:`Malayalam Cinema’s Historic 2024 Renaissance: Manjummel Boys, Aadujeevitham & Aavesham Redefine South Box Office`,summary:`Mollywood cross-border theatrical receipts surge by over 300% as gripping real-life survival and character-driven blockbusters capture global cinephiles.`,category:`Industry Record`,industry:`Mollywood`,date:`2024-05-30`,readTime:`4 min read`,source:`South Indian Film Chamber`,relatedMovieId:`manjummel-boys`,highlightStat:`₹242 Cr First Ever ₹200Cr+ Mollywood Hit`,featured:!1,content:[`2024 will be etched in cinema lore as the golden breakthrough year for Malayalam cinema. Manjummel Boys made history by becoming the first Malayalam film to surpass ₹200 Crore and even ₹240 Crore worldwide.`,`Crucially, over ₹63 Crore of its collection came from Tamil Nadu, marking the first time in Indian cinema that a Malayalam original out-grossed native Tamil releases in Chennai and Coimbatore.`]},{id:`news-6`,title:`Korean Cinema Explodes in 2024: Exhuma & The Roundup 4 Draw Over 23 Million Theatrical Admissions`,summary:`Occult thriller Exhuma and Don Lee’s action powerhouse shatter post-pandemic attendance records in Seoul and international Asian markets.`,category:`Weekend Report`,industry:`Korean`,date:`2024-06-18`,readTime:`3 min read`,source:`Korean Film Council (KOFIC)`,relatedMovieId:`exhuma`,highlightStat:`23.4 Million Admissions Combined`,featured:!1,content:[`South Korea’s theatrical box office witnessed a massive rebound in 2024. Exhuma, Jang Jae-hyun’s supernatural shamanistic mystery, drew 11.9 million ticket buyers, while Ma Dong-seok’s The Roundup: Punishment drew 11.5 million admissions.`,`The twin blockbusters demonstrated the enduring appetite for distinctive genre storytelling in the Hallyu cinematic landscape.`]}],$U=[{id:`pushpa-2-rule`,title:`Pushpa 2: The Rule`,industry:`Tollywood`,language:`Telugu / Pan-India`,releaseDate:`2024-12-05`,director
